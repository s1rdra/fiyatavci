<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FiyatAvcı — Alım tavsiyesi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- serves: REQ-014 -->
<main class="phone">
  <h1>Alım tavsiyesi</h1>
  <p class="note">Takip ettiğin bir ürün için "Şimdi almalı mıyım?" diye sor.</p>
  <div id="messages"></div>
  <p id="error" class="error hidden"></p>
  <form id="chat-form">
    <label for="message">Mesajın</label>
    <input id="message" name="message" autocomplete="off" required>
    <button class="button" type="submit" id="send">Gönder</button>
  </form>
  <nav class="tabs">
    <a href="home.html">Takip listem</a>
    <a href="add.html">Ürün ekle</a>
    <a href="notification.html">Bildirimler</a>
    <a href="chat.html">Alım tavsiyesi</a>
    <a href="#" id="logout">Çıkış</a>
  </nav>
</main>
<script type="module">
  const messages = document.getElementById("messages");
  const error = document.getElementById("error");
  const input = document.getElementById("message");
  const send = document.getElementById("send");

  function addCard(text, fromAi) {
    const card = document.createElement("div");
    card.className = "card";
    if (fromAi) {
      const label = document.createElement("p");
      label.className = "badge";
      label.textContent = "AI answer";
      card.append(label);
    }
    const body = document.createElement("p");
    body.textContent = text;
    card.append(body);
    messages.append(card);
  }

  document.getElementById("chat-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    error.classList.add("hidden");
    addCard(message, false);
    input.value = "";
    send.disabled = true;
    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${sessionStorage.getItem("token")}`,
        },
        body: JSON.stringify({ message }),
      });
      if (response.status === 401) {
        location.href = "login.html";
        return;
      }
      const data = await response.json().catch(() => ({}));
      if (response.ok) {
        addCard(data.answer, true);
      } else {
        // 429: günlük sınır doldu · 503: LLM API cevap vermedi — sunucunun mesajını göster.
        error.textContent = data.detail || "Sohbet botu şu an cevap veremiyor.";
        error.classList.remove("hidden");
      }
    } catch {
      error.textContent = "Sunucuya ulaşılamadı.";
      error.classList.remove("hidden");
    } finally {
      send.disabled = false;
    }
  });

  document.getElementById("logout").addEventListener("click", (event) => {
    event.preventDefault();
    sessionStorage.removeItem("token");
    location.href = "login.html";
  });
</script>
</body>
</html>
